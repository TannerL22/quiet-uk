[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quiet-uk"
version = "0.2.0"
description = "Starter pipeline for UK environmental noise mapping"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5,<3",
    "requests>=2.34,<3",
    "OWSLib>=0.36,<1",
    "rasterio>=1.5,<2",
    "pyproj>=3.7,<4",
    "matplotlib>=3.11,<4",
]

[project.optional-dependencies]
research = [
    "scipy>=1.18,<2",
    "shapely>=2.1,<3",
    "pyshp>=3.1,<4",
]
dev = [
    "pytest>=9,<10",
    "build>=1.3,<2",
    "wheel>=0.46,<1",
    "setuptools>=80.9,<81",
    "scipy>=1.18,<2",
    "shapely>=2.1,<3",
    "pyshp>=3.1,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

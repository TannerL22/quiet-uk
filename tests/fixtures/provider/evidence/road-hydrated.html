ting sound across the same period.\n- The day level (Lday) is a daytime noise indicator based upon annual average A-weighted long-term sound over the daytime period (07:00-19:00) which contains the same sound energy as the actual fluctuating sound across the same period.\n- The evening level (Leve) is an evening noise indicator based upon annual average A-weighted long-term sound over the evening period (19:00-23:00) which contains the same sound energy as the actual fluctuating sound across the same period.\n- The night level (Lnight) is a night-time noise indicator based upon annual average A-weighted long-term sound over the night period (23:00-07:00) which contains the same sound energy as the actual fluctuating sound across the same period.\n\nNoise levels are modelled on a 10m grid at a receptor height of 4m above ground, with a lower threshold cutoff of 35dB for the Lnight metrics, and 40dB for all other metrics. Data is available for all road traffic sources and also those defined as \"major\" under the Regulations.\n\nThis data is a product of the strategic noise mapping analysis undertaken in 2022 to meet the requirements of the Environmental Noise (England) Regulations 2006 (as amended).","tags":["noise exposure","roads"],"visibility":"visible","creator":"Department for Environment, Food \u0026 Rural Affairs","license":"","dataReliability":"","entryType":"dataSet","accrualPeriodicity":"notPlanned","fromTemplate":"5e73d564-b394-40e3-b319-5e1051476974","createdAt":1702036764000,"metadataModified":1753437700442,"modified":1702036764000,"publisher":"auth0|654e1952f8e22408545f20da","concepts":[],"geospatialExtent":{"northBoundLatitude":55.808198,"eastBoundLongitude":2.147937,"southBoundLatitude":49.859572,"westBoundLongitude":-6.454098},"coordinateReferenceSystemId":"http://www.opengis.net/def/crs/EPSG/0/27700","spatialRepresentationType":"grid","lineage":"Modelled in the Defra Noise Modelling System (utilising LimA).","topics":["environment","transportation"] d \u0026 Rural Affairs","role":"pointOfContact","emailAddress":"open@defra.gov.uk","url":"https://www.gov.uk/government/organisations/department-for-environment-food-rural-affairs","urlLabel":"Department for Environment, Food \u0026 Rural Affairs Website"},"distributions":[],"resources":[{"url":"https://environment.data.gov.uk/explore/562c9d56-7c2d-4d42-83bb-578d6e97a517?download=true","name":"RoadNoiseAllMetricsEnglandRound4_Download","id":"6d6bce2e-c9fb-456f-a8ed-9693e6b23715","description":"Download data by area of interest","serviceType":"HTTP Application"},{"url":"https://environment.data.gov.uk/spatialdata/road-noise-all-metrics-england-round-4/wms","name":"RoadNoiseAllMetricsEnglandRound4_WMS","id":"32e3d595-c498-4165-b220-f760c3dafde3","description":"Road Noise - All Metrics - England Round 4 - WMS","serviceType":"WMS"},{"url":"https://environment.data.gov.uk/spatialdata/road-noise-all-metrics-england-round-4/wcs","name":"RoadNoiseAllMetricsEnglandRound4_WCS","id":"a7c1db89-cd13-4dbf-8608-95b272b2edd3","description":"Road Noise - All Metrics - England Round 4 - WCS"}],"services":[],"entitlements":["read"],"isOwner":false,"derivedFrom":[],"usedBy":[{"id":"d2c29c1f-4f52-42eb-82f4-82ff17382abd","title":"Combined Transport Noise - All Metrics - England Round 4","entryType":"dataSet"}],"entitlementsByIdentity":{"PUBLIC":["read"]}},"relatedDatasets":[{"description":"Octave band data indicating the level of noise according to the strategic noise mapping of road sources across England.\n\nPLEASE NOTE ALL DATA IS UNWEIGHTED\n\nThe day-evening-night level (Lden) is a noise indicator for overall annoyance based upon annual average A-weighted long-term sound over 24 hours with a 5 dB(A) penalty for evening noise (19:00-23:00) and a 10 dB(A) penalty for night-time noise (23:00-07:00).  Unweighted octave band levels are provided.\nThe 16-hour equivalent continuous level (Leq,16h) is a noise indicator which describes the annual average steady noise level over the 16-hour daytime period (07:00 to 23:00) which contains the same sound energy as the actual fluctuating sound across the same period.   Unweighted octave band levels are provided.\nThe day level (Lday) is a daytime noise indicator based upon annual average A-weighted long-term sound over the daytime period (07:00-19:00) which contains the same sound energy as the actual fluctuating sound across the same period.   Unweighted octave band levels are provided.\nThe evening level (Leve) is an evening noise indicator based upon annual average A-weighted long-term sound over the evening period (19:00-23:00) which contains the same sound energy as the actual fluctuating sound across the same period.   Unweighted octave band levels are provided.\nThe night level (Lnight) is a night-time noise indicator based upon annual average A-weighted long-term sound over the night period (23:00-07:00) which contains the same sound energy as the actual fluctuating sound across the same period.   Unweighted octave band levels are provided.\nNoise levels are modelled on a 10m grid at a receptor height of 4m above ground, with a lower threshold cutoff of 35dB for the Lnight metric, and 40dB for all other metrics. Data is available for all road traffic sources.\n\nThe provided octave band levels are for 63Hz, 125Hz, 250Hz, 500Hz, 1kHz, 2kHz, 4kHz and 8kHz for each metric listed.\n\nThis data is a product of the strategic noise mapping analysis undertaken in 2022 to meet the requirements of the Environmental Noise (England) Regulations 2006 (as amended).","creator":"Department for Environment, Food \u0026 Rural Affairs","modified":1766016000000,"workflowKeywords":["OpenData","NCEA"],"title":"Road Noise - Octave Band Data - England Round 4","id":"23743291-2503-45f2-a632-c7afef2e8809"}],"files":[],"error":null,"gdprDocument":null},"__N_SSP":true},"page":"/dataset/[datasetId]","query":{"datasetId":"562c9d56-7c2d-4d42-83bb-578d6e97a517"},"buildId":"VTYbxqUwI998Hl9Rh0cza","isFallback":false,"isExperimentalC
